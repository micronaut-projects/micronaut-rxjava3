plugins {
    id "io.micronaut.build.internal.rxjava3-module"
}

dependencies {
    annotationProcessor(mn.micronaut.graal)

    api projects.micronautRxjava3
    api(mn.micronaut.http.client)

    testImplementation(mn.micronaut.http.server.netty)
    testRuntimeOnly mn.micronaut.jackson.databind
}
//TODO remove once Micronaut Test ships Spock version compatible with Groovy 5
configurations.all {
    resolutionStrategy {
        force "org.spockframework:spock-core:2.4-M7-groovy-5.0"
    }
}
